services:
  - type: web
    name: coffeehealth-ai
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn coffee_health.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coffeehealth_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DEBUG
        value: false

databases:
  - name: coffeehealth_db
    plan: free
    databaseName: coffeehealth
    user: coffeehealth_user
